[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
uuid = { version = "1", features = ["v3", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
ahash = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.10"
lz4_flex = "0.11"
toml = "0.8"

rine-protocol = { path = "crates/rine-protocol" }
rine-data = { path = "crates/rine-data" }
rine-world = { path = "crates/rine-world" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
